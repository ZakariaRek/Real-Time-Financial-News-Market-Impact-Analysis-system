spring:


  application:
    grpc:
      server:
        port: 9090
        max-inbound-message-size: 4MB
        max-inbound-metadata-size: 8KB
        keep-alive-time: 30s
        keep-alive-timeout: 5s
        keep-alive-without-calls: true
        max-connection-idle: 60s
        max-connection-age: 30s
        max-connection-age-grace: 5s
        permit-keep-alive-time: 10s
        permit-keep-alive-without-calls: false
        # Enable reflection for debugging tools
        reflection:
          enabled: true
#    grpc:
#      server:
#        port: 9090
#        enable-reflection: true  # Enable for development
#        max-inbound-message-size: 4MB
#        max-inbound-metadata-size: 8KB
    name: MarketImpact

  # Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/market_impact?currentSchema=public
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:zakaria}
#    password: ${DB_PASSWORD:yahyasd56}

    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 60000

  # JPA Configuration - CHANGED: validate to create-drop for development
  jpa:
    hibernate:
      ddl-auto: create-drop  # Changed from 'validate' to auto-create tables
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
        jdbc:
          time_zone: UTC
    open-in-view: false

  # Flyway Configuration - DISABLED temporarily
  flyway:
    enabled: false  # Disabled to prevent conflicts with hibernate auto-ddl

  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 8
          min-idle: 0

  # gRPC Configuration
  grpc:
    server:
      port: 9090

# Logging Configuration

# Management/Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    export:
      prometheus:
        enabled: true

# Application Configuration
app:
  market-impact:
    prediction:
      confidence-threshold: 0.7
      batch-size: 1000
    timescale:
      retention-days: 365
      compression-interval: 7d
    cache:
      prediction-ttl: 3600 # 1 hour in seconds
      market-data-ttl: 300  # 5 minutes in seconds

# Server Configuration
server:
  port: 8082

  servlet:
    context-path: /market-impact
  compression:
    enabled: true
  http2:
    enabled: true

external:
  services:
    nlp-processing:
      host: localhost
      port: 50052
      timeout: 30s

    news-ingestion:
      host: localhost
      port: 4002
      timeout: 30s



  task:
    scheduling:
      pool:
        size: 5
    execution:
      pool:
        core-size: 10
        max-size: 20
        queue-capacity: 100

market-impact:
  sp500:
    symbols:
      - AAPL
      - MSFT
      - GOOGL
      - AMZN
      - NVDA
      - META
      - TSLA
      - BRK.B
      - UNH
      - XOM
      - JPM
      - V
      - JNJ
      - WMT
      - PG
      # Add more as needed
    batch-size: 10
    max-concurrent: 5

  prediction:
    confidence-threshold: 0.7
    batch-size: 100
    sentiment-weight: 0.6
    trend-weight: 0.4

# Market Impact Configuration

logging:
  level:
    io.grpc: DEBUG
    com.market_impact.grpc: DEBUG
    com.market_impact.MarketImpact: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

