spring:
  application:
    name: AlertSignal

  datasource:
    url: jdbc:postgresql://localhost:5432/alertsignal_db
    username: postgres
    password: yahyasd56
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        type:
          preferred_uuid_jdbc_type: CHAR


  grpc:
    server:
      port: 9090
      max-inbound-message-size: 4MB
      max-inbound-metadata-size: 8KB
      keep-alive-time: 30s
      keep-alive-timeout: 5s
      keep-alive-without-calls: true
      max-connection-idle: 60s
      max-connection-age: 30s
      max-connection-age-grace: 5s
      permit-keep-alive-time: 10s
      permit-keep-alive-without-calls: false
      # Enable reflection for debugging tools
      reflection:
        enabled: true

logging:
  level:
    com.alert_signals.AlertSignal: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

server:
  port: 8081
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized