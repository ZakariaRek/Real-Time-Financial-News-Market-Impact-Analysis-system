spring:
  application:
    name: AlertSignal

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_DATABASE}?currentSchema=${DB_SCHEMA:public}&sslmode=require
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_SIZE:5}
      idle-timeout: ${DB_IDLE_TIMEOUT:300000}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:60000}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        type:
          preferred_uuid_jdbc_type: CHAR

  data:
    redis:
      host: ${REDIS_HOST:host.docker.internal}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:3}
      timeout: ${REDIS_TIMEOUT:2000}ms
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:20}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:2}

  # gRPC Server Configuration
  grpc:
    server:
      port: ${GRPC_SERVER_PORT:9095}
      max-inbound-message-size: 4MB
    client:
      market-impact-service:
        address: 'static://${EXTERNAL_SERVICES_MARKET_IMPACT_HOST:localhost}:${EXTERNAL_SERVICES_MARKET_IMPACT_PORT:9090}'
        negotiationType: plaintext
        deadline: 30s
        max-inbound-message-size: 4MB

# External Services Configuration
external:
  services:
    market-impact:
      host: ${EXTERNAL_SERVICES_MARKET_IMPACT_HOST:localhost}
      port: ${EXTERNAL_SERVICES_MARKET_IMPACT_PORT:9090}
      timeout: 30s
    nlp-processing:
      host: ${EXTERNAL_SERVICES_NLP_PROCESSING_HOST:localhost}
      port: ${EXTERNAL_SERVICES_NLP_PROCESSING_PORT:50052}
      timeout: 30s

# Application-specific Configuration
app:
  signals:
    high-confidence-threshold: 0.8
    min-impact-score: 50.0
    cache-ttl-hours: 24
    websocket-update-interval: 5000

logging:
  level:
    com.alert_signals.AlertSignal: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    io.grpc: INFO

server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /api

management:
  server:
    port: ${SERVER_PORT:8081}
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      enabled: true
      show-details: always
      probes:
        enabled: true
    prometheus:
      enabled: true
    info:
      enabled: true
    metrics:
      enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: production
      service: alert-signal
    distribution:
      percentiles-histogram:
        http.server.requests: true
  prometheus:
    metrics:
      export:
        enabled: true
        step: 30s