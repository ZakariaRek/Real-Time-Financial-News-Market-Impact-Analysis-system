  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/alertsignal_db?currentSchema=public}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:zakaria}
#      password: ${DB_PASSWORD:yahyasd56}

    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        type:
          preferred_uuid_jdbc_type: CHAR
  data:
    redis:
      host: ${REDIS_HOST:host.docker.internal}  # Changed from localhost
      port: 6379
      password:
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 8
          min-idle: 2
#    redis:
#      host: ${REDIS_HOST:localhost}
#      port: 6379
#      password:
#      timeout: 2000ms
#      lettuce:
#        pool:
#          max-active: 20
#          max-idle: 8
#          min-idle: 2
  # gRPC Server Configuration

  grpc:
    server:
      port: 9095  # Change this to an available port
      max-inbound-message-size: 4MB
    client:
      market-impact-service:
        address: 'static://localhost:9091'
        negotiationType: plaintext
        deadline: 30s
        max-inbound-message-size: 4MB

# External Services Configuration
external:
  services:
    market-impact:
      host: localhost
      port: 9090
      timeout: 30s

# Application-specific Configuration
app:
  signals:
    # High confidence threshold for signal generation
    high-confidence-threshold: 0.8
    # Minimum impact score for signal generation
    min-impact-score: 50.0
    # Signal cache TTL in hours
    cache-ttl-hours: 24
    # WebSocket update interval in milliseconds
    websocket-update-interval: 5000

logging:
  level:
    com.alert_signals.AlertSignal: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    io.grpc: INFO

server:
  port: 8081
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  prometheus:
    metrics:
      export:
        enabled: true