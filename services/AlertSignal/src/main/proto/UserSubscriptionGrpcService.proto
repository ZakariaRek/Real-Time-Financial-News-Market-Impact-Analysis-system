syntax = "proto3";

package com.alert_signals.grpc;

option java_multiple_files = true;
option java_package = "com.alert_signals.AlertSignal.grpc.generated";

// User Subscription Service
service UserSubscriptionGrpcService {
  rpc CreateSubscription(CreateSubscriptionRequest) returns (SubscriptionResponse);
  rpc GetSubscription(GetSubscriptionRequest) returns (SubscriptionResponse);
  rpc GetSubscriptionByName(GetSubscriptionByNameRequest) returns (SubscriptionResponse);
  rpc GetSubscriptionsByUserId(GetSubscriptionsByUserIdRequest) returns (SubscriptionListResponse);
  rpc GetActiveSubscriptions(GetActiveSubscriptionsRequest) returns (SubscriptionListResponse);
  rpc GetActiveSubscriptionsBySymbol(GetActiveSubscriptionsBySymbolRequest) returns (SubscriptionListResponse);
  rpc GetActiveSubscriptionsBySignalType(GetActiveSubscriptionsBySignalTypeRequest) returns (SubscriptionListResponse);
  rpc UpdateSubscription(UpdateSubscriptionRequest) returns (SubscriptionResponse);
  rpc DeactivateSubscription(DeactivateSubscriptionRequest) returns (DeactivateSubscriptionResponse);
  rpc DeleteSubscription(DeleteSubscriptionRequest) returns (DeleteSubscriptionResponse);
}

// Messages
message CreateSubscriptionRequest {
  string user_id = 1;
  string subscription_name = 2;
  repeated string symbols = 3;
  repeated string signal_types = 4;
  double min_confidence = 5;
  repeated string delivery_methods = 6;
  bool is_active = 7;
}

message GetSubscriptionRequest {
  string id = 1;
}

message GetSubscriptionByNameRequest {
  string subscription_name = 1;
}

message GetSubscriptionsByUserIdRequest {
  string user_id = 1;
}

message GetActiveSubscriptionsRequest {
}

message GetActiveSubscriptionsBySymbolRequest {
  string symbol = 1;
}

message GetActiveSubscriptionsBySignalTypeRequest {
  string signal_type = 1;
}

message UpdateSubscriptionRequest {
  string id = 1;
  string user_id = 2;
  string subscription_name = 3;
  repeated string symbols = 4;
  repeated string signal_types = 5;
  double min_confidence = 6;
  repeated string delivery_methods = 7;
  bool is_active = 8;
}

message DeactivateSubscriptionRequest {
  string id = 1;
}

message DeleteSubscriptionRequest {
  string id = 1;
}

message SubscriptionResponse {
  string id = 1;
  string user_id = 2;
  string subscription_name = 3;
  repeated string symbols = 4;
  repeated string signal_types = 5;
  double min_confidence = 6;
  repeated string delivery_methods = 7;
  bool is_active = 8;
}

message SubscriptionListResponse {
  repeated SubscriptionResponse subscriptions = 1;
}

message DeactivateSubscriptionResponse {
  bool success = 1;
  string message = 2;
}

message DeleteSubscriptionResponse {
  bool success = 1;
  string message = 2;
}