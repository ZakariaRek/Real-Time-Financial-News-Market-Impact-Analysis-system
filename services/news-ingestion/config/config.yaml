# services/news-ingestion/config/config.yaml
server:
  port: 4001
  grpc_port: 4002
  environment: development

database:
  postgres:
    host: localhost
    port: 5432
    database: news_ingestion
    username: postgres
    password: yahyasd56
    ssl_mode: disable
    max_open_conns: 25
    max_idle_conns: 5
    conn_max_lifetime: 5m
    conn_max_idle_time: 1m

redis:
  host: localhost
  port: 6379
  database: 0
  password: ""

logging:
  level: info
  format: text

processing:
  enable_auto_ingestion: true

  # Sentiment Analysis Trigger
  sentiment_trigger_threshold: 10  # Trigger when >= 10 pending articles

  # Cron Schedules
  rss_schedule: "0 */2 * * * *"        # Every 2 minutes
  newsapi_schedule: "0 */7 * * * *"    # Every 7 minutes
  cleanup_schedule: "0 0 0 * * *"      # Daily at midnight

  batch_size: 100
  worker_count: 5
  retry_attempts: 3
  timeout_seconds: 30

# services/news-ingestion/config/config.yaml

news_sources:
  newsapi:
    api_key: ""
    base_url: "https://newsapi.org/v2"
    enabled: true

  twitter:
    bearer_token: ""
    base_url: "https://api.twitter.com/2"
    enabled: false

  # ✅ Updated RSS Feeds with Working URLs
  rss_feeds:
    - name: "Reuters World News"
      url: "https://www.reutersagency.com/feed/?best-topics=political-general&post_type=best"
      enabled: true

    - name: "Reuters Business"
      url: "https://www.reutersagency.com/feed/?best-topics=business-finance&post_type=best"
      enabled: true

    - name: "BBC News - Business"
      url: "http://feeds.bbci.co.uk/news/business/rss.xml"
      enabled: true

    - name: "Financial Times"
      url: "https://www.ft.com/rss/home"
      enabled: true

    - name: "CNBC Top News"
      url: "https://www.cnbc.com/id/100003114/device/rss/rss.html"
      enabled: true

    - name: "MarketWatch Top Stories"
      url: "https://feeds.marketwatch.com/marketwatch/topstories/"
      enabled: true

    - name: "Yahoo Finance"
      url: "https://finance.yahoo.com/news/rssindex"
      enabled: true

    - name: "Seeking Alpha Market News"
      url: "https://seekingalpha.com/feed.xml"
      enabled: true

    - name: "The Wall Street Journal - World News"
      url: "https://feeds.a.dj.com/rss/RSSWorldNews.xml"
      enabled: true

    - name: "Bloomberg Markets"
      url: "https://www.bloomberg.com/feed/podcast/etf-report.xml"
      enabled: false  # Often requires authentication
# External Services
external_services:
  nlp_service:
    grpc_endpoint: "localhost:50052"
    timeout: "30s"
    max_retry: 3