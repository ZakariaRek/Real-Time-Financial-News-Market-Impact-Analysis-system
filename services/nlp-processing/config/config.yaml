server:
  port: 4002
  environment: development

database:
  # PostgreSQL configuration for NLP Processing Service
  # Note: In the original design, this service uses ClickHouse for analytics
  # But implementing PostgreSQL as requested for consistency
  # For production with high-volume analytics, consider ClickHouse on AWS
  postgres:
    host: localhost          # For prod: your-nlp-rds-endpoint.region.rds.amazonaws.com
    port: 5432
    database: nlp_processing
    username: postgres
    password: yahyasd56
    # AWS RDS specific settings for production
    # ssl_mode: require
    # max_open_conns: 30
    # max_idle_conns: 10
    # conn_max_lifetime: 5m
    # conn_max_idle_time: 2m

redis:
  host: localhost
  port: 6379
  database: 1
  password: ""

logging:
  level: info
  format: json


processing:
  batch_size: 50
  worker_count: 3
  retry_attempts: 3
  timeout_seconds: 60
  enable_auto_ingestion: true
  sentiment_trigger_threshold: 10  # Trigger when >= 10 pending articles
  rss_schedule: "0 */2 * * * *"
  newsapi_schedule: "0 */7 * * * *"

grpc:
  port: 50052
  max_receive_message_size: 4194304  # 4MB
  max_send_message_size: 4194304

# services/news-ingestion/config/config.yaml


external_services:
  news_ingestion_service:
    grpc_endpoint: "localhost:50051"
    timeout: "30s"